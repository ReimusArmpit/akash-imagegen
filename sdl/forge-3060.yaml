---
# RTX 3060 12GB — Forge-Neo, published directly on the Akash hostname.
#
# Use this SDL instead of forge-3060-tunnel.yaml when you want the UI on the
# provider's own hostname (https://<provider>.akashnet.net) instead of a
# trycloudflare URL. The tunnel SDL is nicer for a throwaway trial because the
# hostname changes every time; this one is for when you want a stable URL.
#
# Ceiling math (providers bid per ~6s block, in uact = micro-USD):
#   blocks/hour = 600
#   uact/block  = USD_per_hour * 1667      [= 1e6 / 600]
#
#   rtx3060 @ $0.06/hr  ->  100 uact/block   (live API, verified)
#
# 120 uact/block = $0.072/hr => ~20% headroom over the current ask. Enough to
# survive a slow-market day without mass-rejecting bids, tight enough that a
# provider can't quietly charge you 6x. The ceiling is a MAX, not a price: you
# are billed the accepted bid.
version: "2.0"

services:
  ui:
    # PIN THIS to whatever the CI build printed. Akash rejects untagged/:latest
    # images as non-reproducible (hard error, not a warning).
    # Built by .github/workflows/build-image.yml -> pushed to GHCR.
    image: ghcr.io/ReimusArmpit/akash-imagegen:v1
    # The image's ENTRYPOINT is already the supervisor, so command/args only
    # need to point at it. Akash does NOT shell-expand `args`, so any $(VAR)
    # would be taken literally -- hence the absolute path and no substitution.
    command:
      - /bin/bash
      - -lc
    args:
      - >-
        exec /usr/local/bin/entrypoint.sh
    expose:
      # The one endpoint Akash demands. Caddy listens here and forwards to
      # Neo (8188), the download panel (7861) and FileBrowser (7860), all of
      # which stay on loopback inside the container.
      - port: 8080
        as: 80
        to:
          - global: true
        http_options:
          # Forge uploads (LoRA/checkpoint drag-and-drop) blow past 1MB default.
          max_body_size: 1073741824      # 1 GiB
          # Image previews stream over a long-lived connection; the default
          # timeouts will cut a queue mid-run.
          read_timeout: 300000
          send_timeout: 300000
    env:
      # direct = bind the services to 0.0.0.0 and rely on the published port.
      # tunnel = keep everything on loopback and use cloudflared instead.
      - MODE=direct
      - WORK=/work
      # Required; refuse-to-boot when absent. Use ONLY letters, digits, '-' and
      # '_' -- Neo splits api_auth on ':' and ',' and raises ValueError on
      # either, which becomes a restart loop that bills GPU with no UI.
      - NEO_USER=admin
      - NEO_PASS=CHANGEME_at_deploy
      - FB_USER=admin
      - FB_PASS=CHANGEME_at_deploy
      - PROXY_USER=admin
      - PROXY_PASS=CHANGEME_at_deploy
    params:
      storage:
        work:
          mount: /work
          readOnly: false

profiles:
  compute:
    ui:
      resources:
        cpu:
          units: 4.0
        memory:
          size: 12Gi
        storage:
          # Root fs must hold the WHOLE image plus the panel's quota headroom.
          # The image is Forge-only (torch ~6GB + Forge + extensions ~= 14GB),
          # so 50Gi leaves room for the runtime and the image to coexist.
          - size: 50Gi
          - name: work
            size: 60Gi
            attributes:
              persistent: true
              # beta3 = NVMe. OMIT THIS and you silently get beta1 = HDD,
              # which makes checkpoint loads crawl. This is a real trap.
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                # ONLY models that meet the 12GB floor: the scheduler may pick
                # ANY listed entry. This list filters who may bid; it is not a
                # preference order.
                - model: rtx3060      # 12 GB, Ampere 8.6  -- target
                # - model: t4         # 16 GB, Turing 7.5  -- no bf16, slower
                # - model: rtx4080    # 16 GB, Ada   8.9  -- $0.15, usually sold out
  placement:
    akash:
      pricing:
        ui:
          denom: uact          # canonical on BOTH rails. uakt warns/mismatches.
          amount: 120          # $0.072/hr ceiling. See math at top.
deployment:
  ui:
    akash:
      profile: ui
      count: 1
