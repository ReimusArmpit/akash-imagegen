# Build the image on GitHub's runners and push it to GHCR.
#
# WHY THIS EXISTS:
#   The local machine is a thin client -- 14GB of internal storage, no Docker
#   daemon. A `docker build` here needs ~18GB of layers plus ~8GB of build
#   cache, and the GPU box that runs the container is *rented*, so building
#   there would burn GPU-hourly rates on a 15-minute compile.
#
#   So: GitHub builds it, GHCR stores it, Akash pulls it.
#
#   Akash providers pull ANONYMOUSLY, so the package must be public.
#   The image contains no secrets -- the Neo/FileBrowser/proxy credentials
#   come in through the SDL environment at runtime, never baked into a layer.
#
# SECRETS:
#   None. The built-in GITHUB_TOKEN is used for the GHCR push, which works
#   for a public package. No PAT, no stored credential, nothing to leak.
#
# TAGS:
#   Every push tags with the commit SHA (immutable, so the SDL can pin an
#   exact image) plus a moving `latest`. `v1` is also updated, because the
#   SDLs reference it.

name: build-image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one build at a time -- concurrent builds on the same tag would race
# on the GHCR tag and can leave a half-pushed manifest.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is what allows the push to GHCR. It is scoped to this repo
      # and this run only -- it is not a long-lived credential.
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: free disk space
        # GitHub's runners have ~14GB free, and this build pulls torch
        # (~2.5GB compressed) plus the CUDA base (~2GB) plus the nvidia pip
        # wheels (~2.5GB) plus Neo's tree. The runners ship with a lot of
        # preinstalled toolchain cruft that we do not need.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: set up QEMU (not used, but harmless)
        uses: docker/setup-qemu-action@v3

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image is ~14GB uncompressed. The Akash root is 50Gi and must
          # hold the image AND the user's models AND the panel's quota
          # headroom, so we keep the layer count down and skip the build
          # cache export (which would double the registry storage).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CUDA_VERSION=12.8.1
            FORGE_REF=neo

      - name: summary
        run: |
          echo "### Image built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Paste the tag into the SDL \`image:\` line." >> "$GITHUB_STEP_SUMMARY"
