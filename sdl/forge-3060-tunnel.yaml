---
# RTX 3060 12GB — Forge-Neo + FileBrowser.
#
# IMPORTANT: Akash REQUIRES at least one global endpoint. A manifest with no
# `global: true` expose is rejected with:
#     "invalid manifest: zero global services"   (manifest/v2beta2/groups.go:30)
#
# So "publish nothing" is not an option, and the cloudflared-tunnel idea cannot
# stand alone. What this SDL does instead:
#
#   * publishes ONE port (8080) on a tiny internal Caddy reverse proxy
#   * Forge-Neo and FileBrowser stay loopback-only, behind that proxy
#   * the proxy requires Basic auth, and by default returns 404 for everything
#
# That gives you the API surface a provider requires while leaving no UI
# reachable without credentials. If you prefer tunnels only, set MODE=tunnel and
# still keep this port published -- it costs nothing and the deployment is
# invalid without it.
version: "2.0"

services:
  ui:
    # PIN THIS. Akash rejects untagged images and :latest as non-reproducible.
    # Built by .github/workflows/build-image.yml -> pushed to GHCR.
    image: ghcr.io/ReimusArmpit/akash-imagegen:v1
    command:
      - /bin/bash
      - -lc
    args:
      - >-
        exec /usr/local/bin/entrypoint.sh
    env:
      - MODE=tunnel
      # /work is now a plain directory on the root fs. There is NO persistent
      # volume -- see the storage block below.
      - WORK=/work
      # Required; refuse-to-boot when absent. Use ONLY letters, digits, '-' and
      # '_' -- Neo splits api_auth on ':' and ',' and raises ValueError on
      # either, which becomes a restart loop that bills GPU with no UI.
      - NEO_USER=admin
      - NEO_PASS=CHANGEME_at_deploy
      - FB_USER=admin
      - FB_PASS=CHANGEME_at_deploy
      - PROXY_USER=admin
      - PROXY_PASS=CHANGEME_at_deploy
    # The one endpoint Akash demands. Caddy listens here and only here is
    # anything routable; 8188/7860 never leave the container.
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
        http_options:
          # Akash enforces hard ceilings here and REJECTS the SDL at import:
          #   max_body_size <= 104857600 (100 MiB) -- ours was 1 GiB, 10x over
          #   read_timeout  <= 60000 ms (60s)      -- ours was 300000
          #   send_timeout  <= 60000 ms (60s)
          # 100 MiB is the largest value that both passes validation and is
          # useful for LoRA drag-and-drop in Forge.
          max_body_size: 104857600       # 100 MiB = the enforced maximum
          read_timeout: 60000
          send_timeout: 60000

profiles:
  compute:
    ui:
      resources:
        cpu:
          units: 4.0
        memory:
          size: 12Gi
        storage:
          # Measured budget: image is 7.35 GB compressed / ~16 GB unpacked,
          # and the boot-time `cp -a /opt/forge -> /work/forge-neo` adds a
          # second copy of Neo (~2 GB). Fixed cost is ~18 GB before any model.
          # The panel's quota is 20 GB, so 50Gi leaves ~32 GB usable and keeps
          # 20 GB of models comfortably inside the disk.
          - size: 50Gi
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                # TRIAL REALITY: exactly one provider accepts trial deploys
                # (provider.hurricane.akash.pub, California) and its only GPU
                # model is a T4 16Gi. Every other card here would submit and
                # then get no bid, which is what "No node has these GPUs free
                # right now" actually meant -- not that the network was busy.
                #
                # No RTX 3060/70/80/90 exists on Akash at all right now (zero
                # capacity, not zero free), so the old 3060-range pin could
                # never have matched.
                #
                # T4 16Gi clears the 9.8 GB peak this workflow needs. It is
                # Turing (no BF16, weak FP16), so expect roughly 3-5x slower
                # than a 3060 for SDXL. Correctness is fine; patience is not.
                #
                # On a paid wallet, swap this for rtx5000 (16Gi, ~$0.18/hr) or
                # a10g (24Gi, ~$0.18/hr) -- both have real capacity and are
                # only marginally dearer than the T4 while being much faster.
                - model: t4
  placement:
    akash:
      # Trial accounts can only lease from providers carrying
      # console/trials (or console/trials-registered). Without this attribute
      # Console rejects the deployment after submit with a trial-provider
      # error, even when the quote looked fine.
      attributes:
        console/trials: "true"
      signedBy:
        allOf:
          - akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63
      pricing:
        ui:
          denom: uact
          amount: 500           # $0.30/hr ceiling (500 * 600 / 1e6)
          # Was 120 ($0.072/hr), which almost no provider bids on, and a trial
          # holds $1 total -- so the original ceiling was simultaneously too
          # low to attract bids and needlessly tight for a 24h cap. 500 buys
          # ~3.3 GPU-hours of headroom inside the $1 trial credit.
deployment:
  ui:
    akash:
      profile: ui
      count: 1
